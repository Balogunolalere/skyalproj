# Which dependency lifecycle scripts pnpm is allowed to run. pnpm 10+ blocks
# them by default, and this file previously held the prompt text pnpm prints
# ("set this to true or false") for every entry — so nothing was ever built,
# including sharp and @swc/core. Set explicitly.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  es5-ext: true
  sharp: true
  unrs-resolver: true

# Patched transitive lines (security advisories). `next` and `sharp` are pinned
# exactly in package.json.
overrides:
  postcss: 8.5.32
  undici@7: 7.30.1
  nanoid@3: 3.3.20
  browserslist: 4.29.5
  source-map-js: 1.2.2
